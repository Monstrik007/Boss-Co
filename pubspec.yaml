name: boss_game
description: "Boss&Co. — саркастичная локальная игра Босс vs Подчинённые по Wi-Fi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  bonsoir: ^6.0.3
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.2
  uuid: ^4.5.3
  image_picker: ^1.1.2
  image: ^4.5.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
